apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdk 36
    namespace = "com.yalantis.ucrop"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 27
        versionName "2.2.11-native"

        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    resourcePrefix 'ucrop_'

    sourceSets.main {
        jni.srcDirs = []
    }
    lint {
        abortOnError false
    }

    publishing {
        singleVariant("release") {
            // sourcesJar, javadocJar 등 추가하고 싶으면 활성화
            withSourcesJar()
            // withJavadocJar()
        }
    }

}
afterEvaluate {
    publishing {
        publications {
            // 보통 Android 라이브러리는 'release' 컴포넌트를 사용합니다.
            release(MavenPublication) {
                groupId    = project.group
                artifactId = project.name
                version    = project.version
                from components.release
            }
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:${androidx_appcompat_version}"
    implementation "androidx.exifinterface:exifinterface:${androidx_exifinterface_version}"
    implementation "androidx.transition:transition:${androidx_transition_version}"
    implementation "com.squareup.okhttp3:okhttp:${okhttp_version}"
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "androidx.core:core-ktx:1.12.0"
}
